name: printlink
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: printlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printlink}
      POSTGRES_DB: printlink
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U printlink']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://printlink:${POSTGRES_PASSWORD:-printlink}@postgres:5432/printlink?schema=public
    command:
      ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy', '--schema', 'apps/api/prisma/schema.prisma']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://printlink:${POSTGRES_PASSWORD:-printlink}@postgres:5432/printlink?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ['uploads:/app/uploads']
    restart: unless-stopped
  api-dev:
    profiles: ['dev']
    image: node:22-alpine
    working_dir: /app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://printlink:printlink@postgres:5432/printlink?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    command: sh -c "npm install && npm run db:generate -w @printlink/api && npm run dev:watch -w @printlink/api"
    ports: ['4311:4311']
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['8080:80']
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  uploads:
  node_modules:
