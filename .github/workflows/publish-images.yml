name: Publish production images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/printlink-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/printlink-${{ matrix.name }}:main
          cache-from: type=gha,scope=printlink-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=printlink-${{ matrix.name }}
